# Single source of truth for pipeline parameters. DVC tracks the section each
# stage declares in dvc.yaml, so a changed value re-runs exactly that stage and
# everything downstream. Stage CLIs read these as defaults; flags still override.

ingest:
  # Pages (1-based, inclusive ranges) to leave out of training per PDF file name:
  # front/back matter (title pages, contents, Project Gutenberg license) and, for
  # the first book, pages 228-253 which form the frozen benchmark data/bench/holdout-v1.txt.
  exclude_pages:
    think-and-grow-rich-napoleon-hill.pdf: [[1, 6], [228, 253]]
    pg79832-images-3.pdf: [[1, 5], [332, 339]]
  # Regexes (case-insensitive) removed from every page's text before words are
  # extracted: running headers, footers and ads that repeat on each page.
  strip_phrases:
    - 'think & grow rich'
    - 'do you feel frustrated, stuck or overwhelmed by the concepts in this ebook\?.*?www\.think-and-grow-rich-ebook\.com'

extract:
  num_merges: 1000

train:
  steps: 5000
  patience: 5
  batch_size: 32
  lr: 3.0e-4
  eval_interval: 100
  split: 0.9
  seed: 1337
  model:
    block_size: 64
    n_layer: 4
    n_head: 4
    d_model: 128
    dropout: 0.1

evaluate:
  batch_size: 32
  seed: 1337
  sample_length: 40
  prompts_path: data/bench/prompts.txt
